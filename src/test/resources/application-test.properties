spring.datasource.url=jdbc:h2:mem:fashion_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.sql.init.mode=never
spring.jpa.show-sql=false
spring.main.banner-mode=off
spring.cache.type=simple
spring.rabbitmq.listener.simple.auto-startup=false
fashion.jwt.secret=test-secret-key-must-be-at-least-32-bytes-long
fashion.jwt.expiration-ms=86400000
fashion.admin.password=Admin@123
fashion.customer.password=Customer@123
fashion.shipping.simulator.enabled=false
