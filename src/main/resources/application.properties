spring.application.name=fashion
fashion.admin.password=${FASHION_ADMIN_PASSWORD:Admin@123}
fashion.customer.password=${FASHION_CUSTOMER_PASSWORD:Customer@123}
fashion.jwt.secret=${FASHION_JWT_SECRET:fashion-secret-key-must-be-at-least-32-bytes-long-for-hmac-sha}
fashion.jwt.expiration-ms=${FASHION_JWT_EXPIRATION_MS:86400000}

# PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/fashion
spring.datasource.username=fashion
spring.datasource.password=fashion
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:review-migration.sql,classpath:shipping-migration.sql,classpath:order-completion-migration.sql
spring.sql.init.separator=@@
spring.jpa.open-in-view=false
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${SPRING_JPA_FORMAT_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Connection Pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

# Elasticsearch Configuration
spring.elasticsearch.uris=http://localhost:9200

# Redis cache
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.cache.type=redis
spring.cache.redis.key-prefix=fashion::
spring.cache.redis.use-key-prefix=true

# RabbitMQ events
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.listener.simple.default-requeue-rejected=false

# Server config
server.port=8081

# Optional visual search. Keep disabled until a CLIP service and indexed embeddings are available.
fashion.visual-search.enabled=false
fashion.visual-search.clip-url=http://localhost:8000/embed
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# =========================
# VNPAY SANDBOX
# =========================

# Cổng thanh toán của VNPay
vnpay.pay-url=https://sandbox.vnpayment.vn/paymentv2/vpcpay.html

# Thông tin Merchant Sandbox
vnpay.tmn-code=${VNPAY_TMN_CODE:YHMTTQVT}
vnpay.hash-secret=${VNPAY_HASH_SECRET:XVVCFPVNHGYCLCVLUYXBSJQDZAMIGRET}

# VNPay callback URL. Set VNPAY_RETURN_URL to the current public tunnel URL when testing VNPay.
vnpay.return-url=${VNPAY_RETURN_URL:http://localhost:8081/api/vnpay/return}

# Sau khi backend xử lý, đưa khách trở lại React
vnpay.frontend-return-url=${VNPAY_FRONTEND_RETURN_URL:http://localhost:5173/#orders}

# API query/refund của VNPay Sandbox
vnpay.api-url=https://sandbox.vnpayment.vn/merchant_webapi/api/transaction

# Map services for a single-instance demo; use your own/hosted providers for production.
fashion.maps.geocoding-provider=${GEOCODING_PROVIDER:photon}
fashion.maps.geocoding-url=${GEOCODING_URL:https://photon.komoot.io}
fashion.maps.routing-url=${ROUTING_URL:https://router.project-osrm.org}
fashion.maps.user-agent=${MAPS_USER_AGENT:FashionShopDemo/1.0}
fashion.shipping.simulator.enabled=${SHIPPING_SIMULATOR_ENABLED:true}
fashion.shipping.simulator.interval-ms=5000
