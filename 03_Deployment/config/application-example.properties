spring.application.name=fashion

# Demo account passwords
fashion.admin.password=${FASHION_ADMIN_PASSWORD:change_me_admin_password}
fashion.customer.password=${FASHION_CUSTOMER_PASSWORD:change_me_customer_password}

# JWT
fashion.jwt.secret=${FASHION_JWT_SECRET:replace_with_at_least_32_bytes_secret}
fashion.jwt.expiration-ms=${FASHION_JWT_EXPIRATION_MS:86400000}

# PostgreSQL
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:fashion}
spring.datasource.username=${DB_USERNAME:fashion}
spring.datasource.password=${DB_PASSWORD:change_me_database_password}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:review-migration.sql,classpath:shipping-migration.sql,classpath:order-completion-migration.sql
spring.sql.init.separator=@@
spring.jpa.open-in-view=false
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${SPRING_JPA_FORMAT_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Connection pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

# Elasticsearch
spring.elasticsearch.uris=${ELASTICSEARCH_URI:http://localhost:9200}

# Redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.cache.type=redis
spring.cache.redis.key-prefix=fashion::
spring.cache.redis.use-key-prefix=true

# RabbitMQ
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:change_me_rabbitmq_password}
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.listener.simple.default-requeue-rejected=false

# Server
server.port=8081

# Optional visual search
fashion.visual-search.enabled=false
fashion.visual-search.clip-url=http://localhost:8000/embed
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# VNPay sandbox
vnpay.pay-url=https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
vnpay.tmn-code=${VNPAY_TMN_CODE:your_tmn_code}
vnpay.hash-secret=${VNPAY_HASH_SECRET:your_hash_secret}
vnpay.return-url=${VNPAY_RETURN_URL:http://localhost:8081/api/vnpay/return}
vnpay.frontend-return-url=${VNPAY_FRONTEND_RETURN_URL:http://localhost:5173/#orders}
vnpay.api-url=https://sandbox.vnpayment.vn/merchant_webapi/api/transaction

# Map services
fashion.maps.geocoding-provider=${GEOCODING_PROVIDER:photon}
fashion.maps.geocoding-url=${GEOCODING_URL:https://photon.komoot.io}
fashion.maps.routing-url=${ROUTING_URL:https://router.project-osrm.org}
fashion.maps.user-agent=${MAPS_USER_AGENT:FashionShopDemo/1.0}
fashion.shipping.simulator.enabled=${SHIPPING_SIMULATOR_ENABLED:true}
fashion.shipping.simulator.interval-ms=5000
