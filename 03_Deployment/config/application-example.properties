spring.application.name=fashion

# Demo account passwords
fashion.admin.password=${FASHION_ADMIN_PASSWORD:change_me_admin_password}
fashion.customer.password=${FASHION_CUSTOMER_PASSWORD:change_me_customer_password}

# JWT
fashion.jwt.secret=${FASHION_JWT_SECRET:replace_with_at_least_32_bytes_secret}
fashion.jwt.expiration-ms=${FASHION_JWT_EXPIRATION_MS:86400000}

# PostgreSQL
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/fashion}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:fashion}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:base-schema.sql,classpath:review-migration.sql,classpath:shipping-migration.sql,classpath:order-completion-migration.sql,classpath:product-size-chart-migration.sql,classpath:campaign-event-migration.sql,classpath:auth-otp-migration.sql,classpath:return-request-migration.sql,classpath:vat-migration.sql
spring.sql.init.separator=@@
spring.jpa.open-in-view=false
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${SPRING_JPA_FORMAT_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Connection pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

# Elasticsearch
spring.elasticsearch.uris=http://localhost:9200

# Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.cache.type=simple

# RabbitMQ
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.listener.simple.default-requeue-rejected=false
spring.rabbitmq.listener.simple.prefetch=10

# Server
server.port=${PORT:8081}

# Optional visual search
fashion.visual-search.enabled=false
fashion.visual-search.clip-url=http://localhost:8000/embed
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# VNPay sandbox
vnpay.pay-url=https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
vnpay.tmn-code=${VNPAY_TMN_CODE:your_tmn_code}
vnpay.hash-secret=${VNPAY_HASH_SECRET:your_hash_secret}
vnpay.public-base-url=${VNPAY_PUBLIC_BASE_URL:}
vnpay.return-url=${VNPAY_RETURN_URL:}
vnpay.frontend-return-url=${VNPAY_FRONTEND_RETURN_URL:}
vnpay.api-url=https://sandbox.vnpayment.vn/merchant_webapi/api/transaction

# Map services
fashion.maps.geocoding-provider=${GEOCODING_PROVIDER:photon}
fashion.maps.geocoding-url=${GEOCODING_URL:https://photon.komoot.io}
fashion.maps.routing-url=${ROUTING_URL:https://router.project-osrm.org}
fashion.maps.user-agent=${MAPS_USER_AGENT:FashionShopDemo/1.0}
fashion.shipping.simulator.enabled=${SHIPPING_SIMULATOR_ENABLED:true}
fashion.shipping.simulator.interval-ms=5000
